name: Monitor Accatoy

on:
  schedule:
    # 평일 08:00~19:00 KST(=UTC 23:00~10:00)에만 5분마다.
    # GitHub Actions 크론은 UTC 기준이라 날짜가 넘어가는 구간을 세 줄로 나눠 표현했다.
    # KST 요일 기준 평일(월~금)이 되려면 UTC 23시대는 하루 전 요일(일~목)을 써야 한다.
    # (5분은 GitHub Actions 스케줄 크론의 최소 지원 간격. 혼잡한 시간대엔 실제 실행이 더 밀릴 수 있음)
    # 정각/5분 그리드(:00,:05,...)는 GitHub 전역에서 가장 혼잡한 시각이라 스케줄이 자주 드롭됨.
    # 혼잡을 피하려고 분(minute)을 2분 오프셋으로 밀었다 (공식 권장: "start of every hour" 회피).
    - cron: "2-57/5 23 * * 0-4"
    - cron: "2-57/5 0-9 * * 1-5"
    - cron: "3 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor-accatoy
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 다른 실행이 방금 커밋한 감시 상태를 반드시 반영한 뒤 비교해야 중복 알림이 안 생긴다.
      - name: Sync latest watch state
        run: git pull --ff-only origin main

      - run: npm run monitor-accatoy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated watch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/accatoy-watch.json
          git diff --staged --quiet || git commit -m "chore: update accatoy watch state ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase origin main
          git push

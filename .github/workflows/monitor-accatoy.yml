name: Monitor Accatoy

on:
  schedule:
    # 07:00~19:00 KST(=UTC 22:00~10:00)에만 5분마다.
    # GitHub Actions 크론은 UTC 기준이라 날짜가 넘어가는 구간을 세 줄로 나눠 표현했다.
    # (5분은 GitHub Actions 스케줄 크론의 최소 지원 간격. 혼잡한 시간대엔 실제 실행이 더 밀릴 수 있음)
    - cron: "*/5 22,23 * * *"
    - cron: "*/5 0-9 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor-accatoy
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # TEMP DEBUG: GitHub Actions 러너 IP에서 ntfy로 보낸 알림이 실제로 수신되는지 확인용. 확인 후 제거 예정.
      - name: Debug - send test ntfy alert from GitHub Actions
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -X POST "https://ntfy.sh/" \
            -H "Content-Type: application/json" \
            -d "{\"topic\":\"$NTFY_TOPIC\",\"title\":\"GH Actions 디버그 테스트\",\"message\":\"이 알림이 오면 GitHub Actions 러너에서도 정상 전송됩니다\",\"priority\":4,\"tags\":[\"test_tube\"]}"

      # 다른 실행이 방금 커밋한 감시 상태를 반드시 반영한 뒤 비교해야 중복 알림이 안 생긴다.
      - name: Sync latest watch state
        run: git pull --ff-only origin main

      - run: npm run monitor-accatoy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Commit updated watch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/accatoy-watch.json
          git diff --staged --quiet || git commit -m "chore: update accatoy watch state ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase origin main
          git push

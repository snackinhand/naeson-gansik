name: Telegram Heartbeat

on:
  workflow_dispatch:
    inputs:
      status_summary:
        description: "상태 요약 (클라우드 헬스체크 루틴이 채워줌)"
        required: false
        default: "특이사항 없음"
      status_ok:
        description: "true면 정상, false면 문제 감지"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run telegram-heartbeat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS_SUMMARY: ${{ inputs.status_summary }}
          STATUS_OK: ${{ inputs.status_ok }}

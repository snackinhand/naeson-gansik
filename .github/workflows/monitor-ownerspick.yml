name: Monitor Ownerspick

on:
  schedule:
    # 24시간, 30분마다.
    # 정각/30분(:00,:30)은 GitHub 전역 혼잡 시각이라 스케줄이 자주 드롭돼서 오프셋을 줬다.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor-ownerspick
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/playwright'].version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # 다른 실행이 방금 커밋한 감시 상태를 반드시 반영한 뒤 비교해야 중복 알림이 안 생긴다.
      - name: Sync latest watch state
        run: git pull --ff-only origin main

      - run: npm run monitor-ownerspick
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated watch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ownerspick-watch.json
          git diff --staged --quiet || git commit -m "chore: update ownerspick watch state ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase origin main
          git push
